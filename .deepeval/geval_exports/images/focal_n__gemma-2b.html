const nGrid = DATA.n_grid;
const dims = DATA.dimensions;
const nd = dims.length;
const judges = DATA.judges;
const focalOptions = DATA.focal_options;
const R = DATA.rows;
const nR = R.doc.length;

function outcome(L, R, ch, kMi) {
  if (L !== kMi && R !== kMi) return null;
  if (ch < 0) return 0.5;
  return ch === kMi ? 1 : 0;
}

function seriesMk(focalObj, judgeOn, dimOn) {
  const kMi = focalObj.mi;
  const y = [];
  for (let gi = 0; gi < nGrid.length; gi++) {
    const maxDoc = nGrid[gi] - 1;
    const dimSum = new Array(nd).fill(0);
    const dimCnt = new Array(nd).fill(0);
    for (let i = 0; i < nR; i++) {
      if (R.doc[i] > maxDoc) continue;
      if (!judgeOn[R.judge[i]]) continue;
      const o = outcome(R.L[i], R.R[i], R.ch[i], kMi);
      if (o === null) continue;
      const d = R.dim[i];
      dimSum[d] += o;
      dimCnt[d] += 1;
    }
    let s = 0, c = 0;
    for (let d = 0; d < nd; d++) {
      if (!dimOn[d]) continue;
      if (dimCnt[d] > 0) { s += dimSum[d] / dimCnt[d]; c++; }
    }
    y.push(c > 0 ? s / c : NaN);
  }
  return y;
}

function statsOverN(y) {
  const fin = y.filter(v => Number.isFinite(v));
  if (!fin.length) return { mean: NaN, std: 0, yFull: NaN };
  const mean = fin.reduce((a, b) => a + b, 0) / fin.length;
  let s2 = 0;
  for (const x of fin) s2 += (x - mean) * (x - mean);
  const std = fin.length > 1 ? Math.sqrt(s2 / (fin.length - 1)) : 0;
  const yFull = Number.isFinite(y[y.length - 1]) ? y[y.length - 1] : NaN;
  return { mean, std, yFull };
}

const judgeBar = document.getElementById("judge-bar");
const dimBar = document.getElementById("dim-bar");
const focalSel = document.getElementById("focal-ck");
const judgeOn = judges.map(() => true);
const dimOn = dims.map(() => true);

judges.forEach((j, ji) => {
  const lbl = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = true;
  cb.addEventListener("change", () => { judgeOn[ji] = cb.checked; render(); });
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(" " + (j.includes("/") ? j.split("/").pop() : j)));
  judgeBar.appendChild(lbl);
});

dims.forEach((dn, di) => {
  const lbl = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = true;
  cb.addEventListener("change", () => { dimOn[di] = cb.checked; render(); });
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(" " + dn));
  dimBar.appendChild(lbl);
});

focalOptions.forEach((m, i) => {
  const opt = document.createElement("option");
  opt.value = String(i);
  const lab = (m.short || m.id) + " — " + (m.id.length > 56 ? m.id.slice(0, 54) + "…" : m.id);
  opt.textContent = lab;
  focalSel.appendChild(opt);
});
{
  const di = Number(DATA.default_focal_index);
  const ix = Number.isFinite(di) ? Math.max(0, Math.min(di, focalOptions.length - 1)) : 0;
  focalSel.value = String(ix);
}
focalSel.addEventListener("change", render);

document.getElementById("j-all").onclick = () => {
  judgeBar.querySelectorAll("input").forEach((cb, i) => { cb.checked = true; judgeOn[i] = true; });
  render();
};
document.getElementById("j-none").onclick = () => {
  judgeBar.querySelectorAll("input").forEach((cb, i) => { cb.checked = false; judgeOn[i] = false; });
  render();
};
document.getElementById("d-all").onclick = () => {
  dimBar.querySelectorAll("input").forEach((cb, i) => { cb.checked = true; dimOn[i] = true; });
  render();
};
document.getElementById("d-none").onclick = () => {
  dimBar.querySelectorAll("input").forEach((cb, i) => { cb.checked = false; dimOn[i] = false; });
  render();
};

["show-band", "show-mean", "show-full"].forEach(id => {
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("hdr").textContent = (DATA.title || "export") + " — focal M_k(n)";
document.getElementById("sub").textContent =
  (DATA.n_docs != null ? DATA.n_docs + " documents · " : "") +
  nGrid.length + " n values · " + judges.length + " judges · " + focalOptions.length + " focal models · M_k";

function hlineTrace(x0, x1, yv, name, dash, color, width) {
  return {
    x: [x0, x1],
    y: [yv, yv],
    mode: "lines",
    name,
    line: { color, width: width || 1.5, dash: dash || "solid" },
    hovertemplate: name + ": %{y:.4f}<extra></extra>",
  };
}

function render() {
  const anyJ = judgeOn.some(Boolean);
  const anyDim = dimOn.some(Boolean);
  if (!anyJ || !anyDim) {
    Plotly.react("chart", [], {
      template: "plotly_white",
      annotations: [{
        text: !anyJ ? "Select at least one judge" : "Select at least one dimension",
        xref: "paper", yref: "paper", x: 0.5, y: 0.5, showarrow: false,
        font: { size: 15, color: "#64748b" }
      }],
      margin: { t: 30, b: 50, l: 58, r: 16 },
    }, { responsive: true });
    document.getElementById("statbox").textContent = "";
    return;
  }

  const ci = parseInt(focalSel.value, 10);
  const focal = focalOptions[ci];
  const y = seriesMk(focal, judgeOn, dimOn);
  const { mean, std, yFull } = statsOverN(y);

  const xMin = Math.min(...nGrid);
  const xMax = Math.max(...nGrid);

  const traces = [];
  const showBand = document.getElementById("show-band").checked && Number.isFinite(mean) && std > 0;
  if (showBand) {
    const top = nGrid.map(() => mean + std);
    const bot = nGrid.map(() => mean - std);
    const xPoly = nGrid.concat(nGrid.slice().reverse());
    const yPoly = top.concat(bot.slice().reverse());
    traces.push({
      x: xPoly,
      y: yPoly,
      fill: "toself",
      fillcolor: "rgba(214, 39, 40, 0.18)",
      line: { color: "rgba(0,0,0,0)" },
      mode: "lines",
      name: "±1 std over n",
      showlegend: true,
      hoverinfo: "skip",
    });
  }

  traces.push({
    x: nGrid,
    y,
    mode: "lines+markers",
    name: "M_k(n)",
    line: { color: "#1f77b4", width: 2.5 },
    marker: { size: 7, color: "#1f77b4" },
    hovertemplate: "%{x} docs<br>%{y:.4f}<extra></extra>",
  });

  if (document.getElementById("show-mean").checked && Number.isFinite(mean)) {
    traces.push(hlineTrace(xMin, xMax, mean, "mean over n", "dash", "#d62728", 1.8));
  }
  if (document.getElementById("show-full").checked && Number.isFinite(yFull)) {
    traces.push(hlineTrace(xMin, xMax, yFull, "M_k(N) full", "solid", "#333", 1.5));
  }

  const titleMid = focal.step != null ? ("checkpoint step " + focal.step) : focal.short;
  const layout = {
    template: "plotly_white",
    title: {
      text: titleMid + " — mean over dimensions (M_k)",
      font: { size: 14 },
    },
    xaxis: { title: "First n documents (cumulative)" },
    yaxis: {
      title: "M_k(n)",
      range: [-0.02, 1.02],
    },
    margin: { t: 50, b: 52, l: 58, r: 16 },
    legend: { orientation: "h", y: 1.12, x: 0, font: { size: 10 } },
    hovermode: "x unified",
  };

  Plotly.react("chart", traces, layout, { responsive: true });

  let sb = "";
  if (Number.isFinite(mean)) sb += "mean over n: " + mean.toFixed(4) + "\\n";
  if (Number.isFinite(std)) sb += "std over n (ddof=1): " + std.toFixed(4) + "\\n";
  if (Number.isFinite(yFull)) sb += "M_k(N): " + yFull.toFixed(4) + "\\n";
  const fin = y.filter(Number.isFinite);
  if (fin.length) sb += "range over n: " + (Math.max(...fin) - Math.min(...fin)).toFixed(4);
  document.getElementById("statbox").textContent = sb;
}

render();
window.addEventListener("resize", () => Plotly.Plots.resize(document.getElementById("chart")));
