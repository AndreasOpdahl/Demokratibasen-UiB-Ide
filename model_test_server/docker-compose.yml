services:
  model-server:
    build: .
    image: oppsummering-${MODEL_NAME}:latest
    container_name: oppsummering-${MODEL_NAME}
    gpus: all
    ports:
      - "${MODEL_SERVER_PORT:-8000}:8000"
    environment:
      - HF_TOKEN
      - HF_HOME=/cache/huggingface
    volumes:
      - ${ADAPTER_DIR:?Set ADAPTER_DIR in .env or environment}:/app/adapter:ro
      - ${HF_HOME:?Set HF_HOME in .env or environment}:/cache/huggingface
      - ./logs:/app/logs
    command: python app.py --adapter_dir /app/adapter --model_name ${MODEL_NAME} --port 8000 --use_multi_gpu --quantize ${QUANTIZE:-none}
    restart: unless-stopped

