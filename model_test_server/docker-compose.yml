services:
  model-server:
    build: .
    image: model-test-server:latest
    container_name: model-test-server
    gpus: all
    ports:
      - "${MODEL_SERVER_PORT:-8000}:8000"
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface/transformers
    volumes:
      - ${ADAPTER_DIR:?Set ADAPTER_DIR in .env or environment}:/app/checkpoint:ro
      - ${HF_CACHE_DIR:-./cache/huggingface}:/cache/huggingface
      - ./logs:/app/logs
    command: python app.py --checkpoint_path /app/checkpoint --model_name ${MODEL_NAME:-gemma-2-9b} --port 8000 --use_multi_gpu
    restart: unless-stopped
